services:
  # ============================================================================
  # ML Inference Microservice (FastAPI + XGBoost + Isolation Forest + Ensembles)
  # ============================================================================
  ml-service:
    build:
      context: .
      dockerfile: docker/ml.Dockerfile
    image: api-sentinel-ml:latest
    container_name: api-sentinel-ml
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - sentinel-network

  # ============================================================================
  # PostgreSQL Database (API Sentinel Backend Persistence)
  # ============================================================================
  postgres:
    image: postgres:17-alpine
    container_name: api-sentinel-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-api_sentinel}
      POSTGRES_USER: ${DB_USERNAME:-sentinel_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sentinel_dev_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sentinel_user} -d ${DB_NAME:-api_sentinel}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinel-network

  # ============================================================================
  # Backend Service (Spring Boot 3.3.4 / Java 21)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: api-sentinel-backend:latest
    container_name: api-sentinel-backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-api_sentinel}
      - DB_USERNAME=${DB_USERNAME:-sentinel_user}
      - DB_PASSWORD=${DB_PASSWORD:-sentinel_dev_pass}
      - ML_SERVICE_URL=http://ml-service:8000
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=postgres
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sentinel-network

  # ============================================================================
  # Target Demo Application API (E-Commerce Sample)
  # ============================================================================
  demo-api:
    build:
      context: .
      dockerfile: docker/demo-api.Dockerfile
    image: api-sentinel-demo-api:latest
    container_name: api-sentinel-demo-api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    restart: unless-stopped
    networks:
      - sentinel-network

  # ============================================================================
  # API Sentinel Reverse Proxy Gateway
  # ============================================================================
  gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    image: api-sentinel-gateway:latest
    container_name: api-sentinel-gateway
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - BACKEND_URL=http://backend:8080
      - TARGET_API_URL=http://demo-api:5000
      - API_SENTINEL_KEY=sentinel_live_e8a93bf409c7429d8a113200ff921bb4
    depends_on:
      - backend
      - demo-api
    restart: unless-stopped
    networks:
      - sentinel-network

  # ============================================================================
  # Frontend SOC Dashboard & Landing Application (React 18 / Vite / Nginx)
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: api-sentinel-frontend:latest
    container_name: api-sentinel-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - sentinel-network

networks:
  sentinel-network:
    driver: bridge

volumes:
  postgres_data:
